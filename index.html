<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IRAN Coin - Anti-Cheat VIP</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0b111e;
            --card-bg: rgba(22, 33, 56, 0.9);
            --accent-gold: #f5b300;
            --text-main: #ffffff;
            --text-muted: #a0b1c9;
            --btn-grad: linear-gradient(135deg, #f5b300, #ff8c00);
            --ton-grad: linear-gradient(135deg, #0088cc, #00d2ff);
            --card-border: 1px solid rgba(255, 255, 255, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; font-family: 'Poppins', sans-serif; }

        body {
            background: linear-gradient(to bottom, rgba(11, 17, 30, 0.85), rgba(11, 17, 30, 0.95)), url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 90px;
        }

        .header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(11, 17, 30, 0.7);
            backdrop-filter: blur(15px);
            border-bottom: var(--card-border);
            position: sticky; top: 0; z-index: 100;
        }

        .avatar-circle {
            width: 42px; height: 42px; border-radius: 50%;
            background: var(--btn-grad); display: flex; align-items: center;
            justify-content: center; font-weight: 700; font-size: 18px;
            color: #000; box-shadow: 0 0 12px rgba(245, 179, 0, 0.4);
            position: relative;
        }

        .vip-badge-crown { position: absolute; top: -6px; right: -6px; font-size: 14px; display: none; }
        .balance-val { font-size: 20px; font-weight: 800; color: var(--accent-gold); display: flex; align-items: center; gap: 5px; }

        .tab-section { display: none; padding: 20px; flex-direction: column; align-items: center; width: 100%; max-width: 480px; margin: 0 auto; }
        .active-tab { display: flex !important; }

        /* Miner */
        .miner-btn {
            width: 220px; height: 220px; border-radius: 50%;
            background: radial-gradient(circle, #243b67 0%, #111d33 100%);
            border: 4px solid var(--accent-gold);
            box-shadow: 0 0 30px rgba(245, 179, 0, 0.4);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: transform 0.08s;
        }
        .miner-btn:active { transform: scale(0.93); }
        .miner-btn img { width: 80%; height: 80%; object-fit: contain; }

        .energy-bar-bg { width: 100%; height: 12px; background: rgba(0, 0, 0, 0.5); border-radius: 10px; overflow: hidden; margin-top: 10px; }
        .energy-bar-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #00d2ff, #f5b300); transition: width 0.2s linear; }

        /* VIP Tier Card */
        .vip-tier-card {
            width: 100%; background: rgba(15, 23, 42, 0.9);
            border: 2px solid var(--accent-gold); border-radius: 18px;
            padding: 16px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px;
        }
        .vip-tier-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; }
        .ton-btn { background: var(--ton-grad); color: #fff; font-weight: 700; padding: 10px 18px; border-radius: 20px; border: none; cursor: pointer; }
        .active-tier-tag { background: #10b981; color: #fff; padding: 5px 12px; border-radius: 10px; font-size: 12px; font-weight: 700; }

        /* Lucky Spin Wheel */
        .wheel-container { position: relative; width: 260px; height: 260px; margin: 10px auto; }
        #wheelCanvas { width: 100%; height: 100%; border-radius: 50%; }

        /* Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); display: none; justify-content: center; align-items: center;
            z-index: 2000; padding: 20px;
        }
        .modal-card {
            background: #162138; border: 2px solid var(--accent-gold);
            border-radius: 20px; padding: 22px; width: 100%; max-width: 340px; text-align: center;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; height: 70px;
            background: rgba(11, 17, 30, 0.9); backdrop-filter: blur(20px);
            border-top: var(--card-border); display: flex; justify-content: space-around; align-items: center; z-index: 1000;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 11px; flex: 1; cursor: pointer; }
        .nav-item.active { color: var(--accent-gold); }
    </style>
</head>
<body>

    <header class="header">
        <div style="display: flex; align-items: center; gap: 10px;">
            <div class="avatar-circle" id="userAvatar">P<span class="vip-badge-crown" id="vipCrown">👑</span></div>
            <div>
                <div id="userName" style="font-size: 14px; font-weight: 600;">Player</div>
                <div id="userLevelTag" style="font-size: 11px; color: var(--accent-gold);">⛏ Standard Miner</div>
            </div>
        </div>
        <div class="balance-val"><span id="userBalance">0</span> 🪙</div>
    </header>

    <!-- Tab 1: Mine -->
    <div class="tab-section active-tab" id="tab-mine">
        <div class="miner-btn" id="tapBtn"><img src="miner.jpg"></div>
        <div style="width: 100%; max-width: 300px; margin-top: 15px;">
            <div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px;">
                <span>⚡ Energy</span><span id="energyText">1000 / 1000</span>
            </div>
            <div class="energy-bar-bg"><div class="energy-bar-fill" id="energyFill"></div></div>
        </div>
    </div>

    <!-- Tab 2: VIP -->
    <div class="tab-section" id="tab-vip">
        <div style="text-align: center; margin-bottom: 20px;">
            <h2 style="color: var(--accent-gold);">👑 VIP STORE</h2>
            <p style="font-size: 11px; color: var(--text-muted);">After payment, VIP will be activated by Admin within 1-12 hours.</p>
        </div>

        <div class="vip-tier-card" id="cardBronze">
            <div class="vip-tier-header"><span>🥉 Bronze VIP</span><span style="color:#00d2ff">0.1 TON</span></div>
            <button class="ton-btn" onclick="requestVip('Bronze', 0.1)">Buy Membership 💎</button>
        </div>

        <div class="vip-tier-card" id="cardSilver">
            <div class="vip-tier-header"><span>🥈 Silver VIP</span><span style="color:#00d2ff">0.5 TON</span></div>
            <button class="ton-btn" onclick="requestVip('Silver', 0.5)">Buy Membership 💎</button>
        </div>

        <div class="vip-tier-card" id="cardGold">
            <div class="vip-tier-header"><span>🥇 Gold VIP</span><span style="color:#00d2ff">1.5 TON</span></div>
            <button class="ton-btn" onclick="requestVip('Gold', 1.5)">Buy Membership 👑</button>
        </div>

        <div class="vip-tier-card" id="cardDiamond">
            <div class="vip-tier-header"><span>💎 Diamond VIP</span><span style="color:#00d2ff">3.0 TON</span></div>
            <button class="ton-btn" onclick="requestVip('Diamond', 3.0)">Buy Membership 💎</button>
        </div>
    </div>

    <!-- Tab 3: Earn -->
    <div class="tab-section" id="tab-earn">
        <div class="wheel-container">
            <canvas id="wheelCanvas" width="260" height="260"></canvas>
        </div>
        <button id="spinBtn" style="background:var(--btn-grad); width: 100%; padding: 15px; border-radius: 15px; border:none; font-weight:800; cursor:pointer;" onclick="spinWheel()">SPIN DAILY WHEEL</button>
        
        <div style="width:100%; margin-top:20px;">
            <div class="vip-tier-card" style="flex-direction:row; justify-content:space-between; align-items:center;">
                <span>🎬 Watch Ad</span>
                <button class="ton-btn" onclick="watchVideoAd()">Watch</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="customModal">
        <div class="modal-card">
            <div id="modalTitle" style="color:var(--accent-gold); font-weight:800; margin-bottom:10px;">NOTICE</div>
            <div id="modalDesc" style="font-size:13px; color:#fff; margin-bottom:20px;">Message...</div>
            <button style="background:var(--btn-grad); border:none; padding:10px 30px; border-radius:10px; font-weight:700;" onclick="closeModal()">OK, I UNDERSTAND</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('tab-mine', this)"><span>⛏</span><span>Mine</span></div>
        <div class="nav-item" onclick="switchTab('tab-vip', this)"><span>👑</span><span>VIP</span></div>
        <div class="nav-item" onclick="switchTab('tab-earn', this)"><span>💰</span><span>Earn</span></div>
    </nav>

    <script>
        const ADMIN_WALLET = "UQCcUO7XRuLyf46obnkSUrec5L00yng7sw8Jut04rlLKCSjB";
        const tg = window.Telegram.WebApp;
        tg.expand();

        let balance = parseInt(localStorage.getItem('bal')) || 0;
        let vipTier = localStorage.getItem('vip') || "Free";
        let tapValue = parseInt(localStorage.getItem('tap')) || 1;
        let maxEnergy = parseInt(localStorage.getItem('maxen')) || 1000;
        let energy = maxEnergy;

        function updateUI() {
            document.getElementById('userBalance').innerText = balance.toLocaleString();
            document.getElementById('energyText').innerText = `${energy} / ${maxEnergy}`;
            document.getElementById('energyFill').style.width = `${(energy/maxEnergy)*100}%`;
            
            if (vipTier !== "Free") {
                document.getElementById('vipCrown').style.display = 'block';
                document.getElementById('userLevelTag').innerText = `👑 ${vipTier} VIP`;
            }
            localStorage.setItem('bal', balance);
        }
        updateUI();

        function switchTab(id, el) {
            document.querySelectorAll('.tab-section').forEach(t => t.classList.remove('active-tab'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active-tab');
            el.classList.add('active');
            if (id === 'tab-earn') drawWheel();
        }

        // --- ANTI-CHEAT VIP REQUEST ---
        function requestVip(tier, amount) {
            const memo = `VIP_${tier}_${tg.initDataUnsafe.user?.id || '979411415'}`;
            const url = `https://app.tonkeeper.com/transfer/${ADMIN_WALLET}?amount=${amount * 1e9}&text=${memo}`;
            
            tg.openLink(url);

            // نمایش پیام انتظار (بدون دکمه تایید فعال‌سازی)
            showAppModal(
                "PURCHASE PENDING ⏳",
                `Your request for ${tier} VIP (Memo: ${memo}) has been sent to Admin. \n\nPlease complete the transfer in your wallet. Your status will update automatically once verified on the blockchain.`
            );
        }

        function showAppModal(title, desc) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc;
            document.getElementById('customModal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('customModal').style.display = 'none'; }

        // Miner
        document.getElementById('tapBtn').addEventListener('pointerdown', (e) => {
            if (energy < tapValue) return;
            energy -= tapValue; balance += tapValue; updateUI();
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        });

        // Energy Regen
        setInterval(() => { if (energy < maxEnergy) { energy = Math.min(maxEnergy, energy + 2); updateUI(); } }, 1000);

        // Lucky Spin
        const prizeLabels = ["500 🪙", "10 🪙", "TRY AGAIN ❌", "50 🪙", "NO LUCK ❌", "20 🪙", "100 🪙", "TRY AGAIN ❌"];
        const prizeValues = [500, 10, 0, 50, 0, 20, 100, 0];
        
        function drawWheel() {
            const canvas = document.getElementById("wheelCanvas");
            const ctx = canvas.getContext("2d");
            ctx.clearRect(0,0,260,260);
            for (let i = 0; i < 8; i++) {
                ctx.beginPath();
                ctx.fillStyle = i % 2 === 0 ? "#1e293b" : "#0f172a";
                if (i === 0) ctx.fillStyle = "#f5b300";
                ctx.moveTo(130,130);
                ctx.arc(130,130,125, i * Math.PI/4, (i+1) * Math.PI/4);
                ctx.fill();
                ctx.save();
                ctx.translate(130,130);
                ctx.rotate(i * Math.PI/4 + Math.PI/8);
                ctx.fillStyle = "#fff";
                ctx.font = "bold 10px Arial";
                ctx.fillText(prizeLabels[i], 70, 5);
                ctx.restore();
            }
        }

        function spinWheel() {
            const today = new Date().toDateString();
            if (localStorage.getItem('spin_date') === today) return showAppModal("ALREADY SPUN", "Try again tomorrow!");
            
            const btn = document.getElementById('spinBtn');
            btn.disabled = true;
            const canvas = document.getElementById("wheelCanvas");
            
            let winIdx = localStorage.getItem('first_spin') ? Math.floor(Math.random()*8) : 0;
            localStorage.setItem('first_spin', 'done');

            const deg = 3600 + (winIdx * 45);
            canvas.style.transition = "transform 4s cubic-bezier(0.1, 0.7, 0.1, 1)";
            canvas.style.transform = `rotate(-${deg}deg)`;

            setTimeout(() => {
                balance += prizeValues[winIdx];
                localStorage.setItem('spin_date', today);
                updateUI();
                showAppModal("SPIN RESULT", prizeValues[winIdx] > 0 ? `🎉 You won ${prizeValues[winIdx]} Coins!` : "❌ Better luck tomorrow!");
                btn.disabled = false;
            }, 4500);
        }

        async function watchVideoAd() {
            if (window.Adsgram) {
                const ad = window.Adsgram.init({ blockId: "ddb6" });
                try {
                    const res = await ad.show();
                    if (res.done) { balance += 100; updateUI(); showAppModal("AD REWARD", "🎉 +100 Coins received!"); }
                } catch(e) { balance += 100; updateUI(); }
            }
        }
    </script>
</body>
</html>
