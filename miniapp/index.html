<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>IRAN Coin Bot</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <link rel="stylesheet" href="style.css?v=500" />
</head>
<body>
  <!-- صفحه اسپلش برج میلاد و پرچم (طرح عکس اول) -->
  <section id="splash" class="splash">
    <div>
      <div class="hero-coin">
        <img src="https://i.ibb.co/3s8s22H/iran-map-gold-3d.png" class="coin-img" alt="IRAN Coin" />
      </div>
      <div class="hero-title">IRAN COIN</div>
      <div class="hero-sub">Earn • Play • Withdraw</div>
    </div>

    <div>
      <div class="hero-text">
        Welcome to IRAN Coin! Watch ads, complete tasks, tap miner, and invite friends to earn IRAN coins.
      </div>

      <div class="hero-actions">
        <div class="mini-action" onclick="openApp('ads')">▶<span>Watch Ads</span></div>
        <div class="mini-action" onclick="openApp('tasks')">✓<span>Tasks</span></div>
        <div class="mini-action" onclick="openCPXOfferwall()">📋<span>Surveys</span></div>
        <div class="mini-action" onclick="openApp('miner')">⛏<span>Miner</span></div>
      </div>

      <button class="start-btn" onclick="openApp('home')">🚀 Start</button>
    </div>
  </section>

  <!-- برنامه اصلی -->
  <section id="app" class="app hidden">
    <header class="topbar">
      <div class="brand">
        <div class="brand-flag">
          <img src="https://flagcdn.com/w80/ir.png" alt="Iran" style="width:100%; height:100%; object-fit:cover;" />
        </div>
        <div>
          <div class="brand-title">IRAN Coin Bot</div>
          <div class="brand-sub">mini app</div>
        </div>
      </div>
      <button id="backBtn" class="hidden" onclick="goBack()" style="background:none; border:none; color:white; font-size:22px; cursor:pointer;">←</button>
    </header>

    <main id="page" class="page"></main>

    <!-- منوی پایین -->
    <nav class="nav">
      <button class="nav-btn active" data-page="home" onclick="navTo('home')"><span class="i">🏠</span><span>Home</span></button>
      <button class="nav-btn" data-page="ads" onclick="navTo('ads')"><span class="i">▶</span><span>Ads</span></button>
      <button class="nav-btn" data-page="miner" onclick="navTo('miner')"><span class="i">⛏</span><span>Miner</span></button>
      <button class="nav-btn" data-page="tasks" onclick="navTo('tasks')"><span class="i">✓</span><span>Tasks</span></button>
      <button class="nav-btn" data-page="wallet" onclick="navTo('wallet')"><span class="i">👛</span><span>Wallet</span></button>
    </nav>
  </section>

  <script src="app.js?v=500"></script>
</body>
</html>
