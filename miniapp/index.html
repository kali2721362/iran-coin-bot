<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>IRAN Coin Bot</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body>
  <!-- Splash -->
  <section id="splash" class="splash">
    <div class="splash-bg"></div>

    <div class="splash-content">
      <div class="splash-coin">
        <div class="coin-ring">
          <div class="coin-face">
            <div class="flag">
              <div class="f g"></div>
              <div class="f w">
                <span class="allah">الله</span>
              </div>
              <div class="f r"></div>
            </div>
            <div class="coin-iran">IRAN</div>
          </div>
        </div>
      </div>

      <div class="splash-title">IRAN COIN</div>
      <div class="splash-sub">Earn • Play • Withdraw</div>

      <div class="splash-card">
        <div class="splash-welcome">Welcome to IRAN Coin!</div>
        <div class="splash-text">
          Watch ads, complete tasks and invite friends. Earn IRAN coins and withdraw to your wallet.
        </div>

        <div class="splash-shortcuts">
          <button class="shortcut" onclick="openApp('ads')">▶<span>Watch Ads</span></button>
          <button class="shortcut" onclick="openApp('tasks')">✓<span>Tasks</span></button>
          <button class="shortcut" onclick="openApp('invite')">👥<span>Invite</span></button>
          <button class="shortcut" onclick="openApp('withdraw')">↑<span>Withdraw</span></button>
        </div>
      </div>

      <button class="btn-start" onclick="openApp('home')">🚀 Start</button>
    </div>
  </section>

  <!-- App -->
  <section id="app" class="app hidden">
    <header class="topbar">
      <div class="topbar-left">
        <button id="backBtn" class="back hidden" onclick="goBack()">←</button>
        <div class="brand">
          <div class="brand-flag">
            <div class="bf g"></div>
            <div class="bf w"><span>الله</span></div>
            <div class="bf r"></div>
          </div>
          <div class="brand-text">
            <div class="brand-title">IRAN Coin Bot</div>
            <div class="brand-sub">mini app</div>
          </div>
        </div>
      </div>
      <button class="more">⋮</button>
    </header>

    <main id="page" class="page"></main>

    <nav class="nav">
      <button class="nav-btn active" data-page="home" onclick="navTo('home')">
        <span class="ico">🏠</span><span class="lbl">Home</span>
      </button>
      <button class="nav-btn" data-page="ads" onclick="navTo('ads')">
        <span class="ico">▶</span><span class="lbl">Ads</span>
      </button>
      <button class="nav-btn" data-page="tasks" onclick="navTo('tasks')">
        <span class="ico">✓</span><span class="lbl">Tasks</span>
      </button>
      <button class="nav-btn" data-page="wallet" onclick="navTo('wallet')">
        <span class="ico">👛</span><span class="lbl">Wallet</span>
      </button>
      <button class="nav-btn" data-page="more" onclick="navTo('more')">
        <span class="ico">≡</span><span class="lbl">More</span>
      </button>
    </nav>
  </section>

  <script src="app.js"></script>
</body>
</html>
