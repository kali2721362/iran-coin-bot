<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>IRAN Coin Bot</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <link rel="stylesheet" href="style.css?v=3000" />
</head>
<body>
  <!-- Splash Screen با بنر داخلی پرچم و برج میلاد (SVG بدون نیاز به عکس بیرونی) -->
  <section id="splash" class="splash">
    <div class="splash-banner">
      <!-- گرافیک ترکیبی پرچم و برج میلاد -->
      <svg viewBox="0 0 300 180" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:auto;">
        <defs>
          <linearGradient id="flagG" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#22c55e" stop-opacity="0.8"/>
            <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#ef4444" stop-opacity="0.8"/>
          </linearGradient>
          <radialGradient id="coinG" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#fef08a"/>
            <stop offset="50%" stop-color="#f59e0b"/>
            <stop offset="100%" stop-color="#b45309"/>
          </radialGradient>
        </defs>
        <!-- زمینه پرچم -->
        <rect width="300" height="180" rx="15" fill="url(#flagG)"/>
        <!-- سیلوئت برج میلاد -->
        <path d="M230 180 L232 110 L225 105 L225 90 L233 85 L231 30 L234 10 L236 30 L234 85 L242 90 L242 105 L235 110 L237 180 Z" fill="#0f172a" opacity="0.85"/>
        <!-- سکه مرکزی طلایی -->
        <circle cx="150" cy="90" r="45" fill="url(#coinG)" stroke="#fef08a" stroke-width="3"/>
        <text x="150" y="98" font-family="sans-serif" font-weight="900" font-size="16" fill="#78350f" text-anchor="middle">IRAN</text>
      </svg>

      <div class="hero-title">IRAN COIN</div>
      <div class="hero-sub">Earn • Play • Withdraw</div>
    </div>

    <div>
      <div class="hero-text">
        Welcome to IRAN Coin! Watch ads, complete tasks, tap the Iran map miner, and invite friends.
      </div>

      <div class="hero-actions">
        <div class="mini-action" onclick="openApp('ads')">▶<span>Watch Ads</span></div>
        <div class="mini-action" onclick="openApp('miner')">⛏<span>Miner</span></div>
        <div class="mini-action" onclick="openApp('tasks')">✓<span>Tasks</span></div>
        <div class="mini-action" onclick="openCPXOfferwall()">📋<span>Surveys</span></div>
      </div>

      <button class="start-btn" onclick="openApp('home')">🚀 Start Playing</button>
    </div>
  </section>

  <!-- App Main Layout -->
  <section id="app" class="app hidden">
    <header class="topbar">
      <div class="brand">
        <div class="brand-badge">🇮🇷</div>
        <div>
          <div class="brand-title">IRAN Coin Bot</div>
          <div class="brand-sub">mini app</div>
        </div>
      </div>
      <button id="backBtn" class="hidden" onclick="goBack()" style="background:none; border:none; color:white; font-size:22px; cursor:pointer;">←</button>
    </header>

    <main id="page" class="page"></main>

    <!-- Bottom Nav -->
    <nav class="nav">
      <button class="nav-btn active" data-page="home" onclick="navTo('home')"><span class="i">🏠</span><span>Home</span></button>
      <button class="nav-btn" data-page="ads" onclick="navTo('ads')"><span class="i">▶</span><span>Ads</span></button>
      <button class="nav-btn" data-page="miner" onclick="navTo('miner')"><span class="i">⛏</span><span>Miner</span></button>
      <button class="nav-btn" data-page="tasks" onclick="navTo('tasks')"><span class="i">✓</span><span>Tasks</span></button>
      <button class="nav-btn" data-page="wallet" onclick="navTo('wallet')"><span class="i">👛</span><span>Wallet</span></button>
    </nav>
  </section>

  <script src="app.js?v=3000"></script>
</body>
</html>
